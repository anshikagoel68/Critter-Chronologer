# H2 in-memory database configuration for testing
spring.datasource.url=jdbc:h2:mem:critter_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root1234

# Hibernate configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Initialize datasource before running tests
spring.jpa.defer-datasource-initialization=true